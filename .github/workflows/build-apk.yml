name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: >-
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=MAPTILER_KEY=${{ secrets.MAPTILER_KEY }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk metro-jatri.apk
      - uses: actions/upload-artifact@v4
        with:
          name: metro-jatri-apk
          path: metro-jatri.apk
      # Publish to a "latest" release so the phone can download it directly.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: মেট্রো যাত্রী (সর্বশেষ)
          body: ফোনে এই APK ডাউনলোড করে ইনস্টল করুন। কমিট ${{ github.sha }}
          files: metro-jatri.apk
          make_latest: true
